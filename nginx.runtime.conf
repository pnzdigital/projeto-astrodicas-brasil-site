# ⚠️ TLS Termination Assumption: This nginx config listens on HTTP (port 80) only.
# HTTPS termination and TLS handling must be done by a reverse proxy (e.g., Traefik, Coolify).
# This container is NOT exposed directly to the internet; it expects traffic forwarded
# from a secure reverse proxy that has already decrypted the HTTPS connection.

map $host $sales_host_enabled {
  default 1;
  dash.astrodicas.pnzdigital.com.br 0;
}

map $host $root_entry {
  default /storefront.html;
  dash.astrodicas.pnzdigital.com.br /index.html;
}

map $host $robots_file {
  default /robots.txt;
  dash.astrodicas.pnzdigital.com.br /robots-dash.txt;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. `always` so they also apply to 4xx/5xx responses.
  # HSTS: safe because TLS terminates upstream (Coolify proxy) and the only
  # subdomain this config routes (dash.) is HTTPS-only. No `preload` — that's a
  # one-way submission to browser preload lists; not worth it until every
  # current and future subdomain is guaranteed HTTPS-only forever.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
  # CSP: 'unsafe-inline' on script-src/style-src is debt — pages use inline
  # <script> blocks and style="" attributes with no nonce/hash pipeline.
  # Removing it needs a build step that hashes or nonces every inline block.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://i.ytimg.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self' https://www.facebook.com https://*.mercadopago.com https://api.mercadopago.com; frame-src https://www.youtube-nocookie.com https://*.mercadopago.com https://*.mercadolibre.com; form-action 'self' https://*.mercadopago.com" always;

  location = /healthz {
    add_header Content-Type text/plain;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://i.ytimg.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self' https://www.facebook.com https://*.mercadopago.com https://api.mercadopago.com; frame-src https://www.youtube-nocookie.com https://*.mercadopago.com https://*.mercadolibre.com; form-action 'self' https://*.mercadopago.com" always;
    return 200 'ok\n';
  }

  location = / { try_files $root_entry =404; }
  location = /es { try_files $root_entry =404; }
  location = /es/ { try_files $root_entry =404; }
  location = /index.html { if ($sales_host_enabled = 1) { return 404; } try_files /index.html =404; }

  location = /oferta-lua-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /oferta-lua-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /es/oferta-lua-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /es/oferta-lua-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /oferta-lua-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /oferta-lua-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /es/oferta-lua-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /es/oferta-lua-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }

  # A landing do horóscopo grátis é o destino do tráfego pago: é a primeira
  # página que o anúncio abre, nos dois idiomas.
  location = /horoscopo { try_files /horoscopo-gratis.html =404; }
  location = /horoscopo/ { try_files /horoscopo-gratis.html =404; }
  location = /es/horoscopo { try_files /horoscopo-gratis.html =404; }
  location = /es/horoscopo/ { try_files /horoscopo-gratis.html =404; }

  location = /caderno/ascendente { try_files /caderno/ascendente-hora-nascimento.html =404; }
  location = /es/caderno/ascendente { try_files /caderno/ascendente-hora-nascimento.html =404; }
  location = /caderno/sinastria { try_files /caderno/sinastria-nao-e-sentenca.html =404; }
  location = /es/caderno/sinastria { try_files /caderno/sinastria-nao-e-sentenca.html =404; }
  location = /caderno/retrogrado { try_files /caderno/o-que-observar-retrogrado.html =404; }
  location = /es/caderno/retrogrado { try_files /caderno/o-que-observar-retrogrado.html =404; }

  location = /checkout { try_files /checkout.html =404; }
  location = /es/checkout { try_files /checkout.html =404; }
  location = /obrigado { try_files /obrigado.html =404; }
  location = /es/obrigado { try_files /obrigado.html =404; }
  location = /admin { if ($sales_host_enabled = 1) { return 404; } try_files /admin.html =404; }

  location = /termos { try_files /termos.html =404; }
  location = /es/termos { try_files /termos.html =404; }
  location = /privacidade { try_files /privacidade.html =404; }
  location = /es/privacidade { try_files /privacidade.html =404; }
  location = /suporte { try_files /suporte.html =404; }
  location = /es/suporte { try_files /suporte.html =404; }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(?:html|js)$ {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://i.ytimg.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self' https://www.facebook.com https://*.mercadopago.com https://api.mercadopago.com; frame-src https://www.youtube-nocookie.com https://*.mercadopago.com https://*.mercadolibre.com; form-action 'self' https://*.mercadopago.com" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|svg|webmanifest)$ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://i.ytimg.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self' https://www.facebook.com https://*.mercadopago.com https://api.mercadopago.com; frame-src https://www.youtube-nocookie.com https://*.mercadopago.com https://*.mercadolibre.com; form-action 'self' https://*.mercadopago.com" always;
    try_files $uri =404;
  }

  location = /robots.txt { try_files $robots_file =404; }
  location = /sitemap.xml {
    if ($sales_host_enabled = 0) { return 404; }
    add_header Content-Type application/xml;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://i.ytimg.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self' https://www.facebook.com https://*.mercadopago.com https://api.mercadopago.com; frame-src https://www.youtube-nocookie.com https://*.mercadopago.com https://*.mercadolibre.com; form-action 'self' https://*.mercadopago.com" always;
    try_files /sitemap.xml =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri/ $root_entry;
  }
}
