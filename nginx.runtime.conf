# ⚠️ TLS Termination Assumption: This nginx config listens on HTTP (port 80) only.
# HTTPS termination and TLS handling must be done by a reverse proxy (e.g., Traefik, Coolify).
# This container is NOT exposed directly to the internet; it expects traffic forwarded
# from a secure reverse proxy that has already decrypted the HTTPS connection.

map $host $sales_host_enabled {
  default 1;
  dash.astrodicas.pnzdigital.com.br 0;
}

map $host $root_entry {
  default /storefront.html;
  dash.astrodicas.pnzdigital.com.br /index.html;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location = / { try_files $root_entry =404; }
  location = /es { try_files $root_entry =404; }
  location = /es/ { try_files $root_entry =404; }
  location = /index.html { if ($sales_host_enabled = 1) { return 404; } try_files /index.html =404; }

  location = /oferta-lua-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /oferta-lua-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /es/oferta-lua-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /es/oferta-lua-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /oferta-lua-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /oferta-lua-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }
  location = /es/oferta-lua-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v1/index.html =404; }
  location = /es/oferta-lua-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-plano-lua/v2/index.html =404; }

  location = /checkout { try_files /checkout.html =404; }
  location = /es/checkout { try_files /checkout.html =404; }
  location = /obrigado { try_files /obrigado.html =404; }
  location = /es/obrigado { try_files /obrigado.html =404; }
  location = /admin { if ($sales_host_enabled = 1) { return 404; } try_files /admin.html =404; }

  location = /termos { try_files /termos.html =404; }
  location = /es/termos { try_files /termos.html =404; }
  location = /privacidade { try_files /privacidade.html =404; }
  location = /es/privacidade { try_files /privacidade.html =404; }
  location = /suporte { try_files /suporte.html =404; }
  location = /es/suporte { try_files /suporte.html =404; }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(?:html|js)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $root_entry;
  }
}
