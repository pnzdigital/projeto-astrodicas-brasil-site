[pytest]
# A suíte padrão é api/tests. O roteiro E2E (api/scripts/e2e_validation.py) fica
# fora da coleta automática de propósito: ele aponta DATABASE_URL para um banco
# próprio no momento do import, e ``app.db`` só é importado uma vez por processo
# — coletar os dois juntos faz as duas suítes brigarem pela mesma engine.
#
# Rodar o E2E é explícito:
#   .venv/bin/python -m pytest api/scripts/e2e_validation.py
testpaths = api/tests
