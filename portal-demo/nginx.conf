map $host $sales_host_enabled {
  default 1;
  dash.astrodicas.pnzdigital.com.br 0;
}

map $host $root_entry {
  default /storefront.html;
  dash.astrodicas.pnzdigital.com.br /index.html;
}

map $host $robots_file {
  default /robots.txt;
  dash.astrodicas.pnzdigital.com.br /robots-dash.txt;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location = / { try_files $root_entry =404; }
  location = /es { try_files $root_entry =404; }
  location = /es/ { try_files $root_entry =404; }
  location = /index.html { if ($sales_host_enabled = 1) { return 404; } try_files /index.html =404; }

  location = /diario-astral-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v1/index.html =404; }
  location = /diario-astral-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v2/index.html =404; }
  location = /es/diario-astral-1 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v1/index.html =404; }
  location = /es/diario-astral-2 { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v2/index.html =404; }
  location = /diario-astral-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v1/index.html =404; }
  location = /diario-astral-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v2/index.html =404; }
  location = /es/diario-astral-1/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v1/index.html =404; }
  location = /es/diario-astral-2/ { if ($sales_host_enabled = 0) { return 404; } try_files /lp-diario-astral/v2/index.html =404; }
  # 301 permanentes para anúncios e links salvos que ainda apontam para as rotas antigas
  location = /oferta-lua-1 { return 301 /diario-astral-1; }
  location = /oferta-lua-2 { return 301 /diario-astral-2; }
  location = /es/oferta-lua-1 { return 301 /es/diario-astral-1; }
  location = /es/oferta-lua-2 { return 301 /es/diario-astral-2; }
  location = /oferta-lua-1/ { return 301 /diario-astral-1; }
  location = /oferta-lua-2/ { return 301 /diario-astral-2; }
  location = /es/oferta-lua-1/ { return 301 /es/diario-astral-1; }
  location = /es/oferta-lua-2/ { return 301 /es/diario-astral-2; }

  location = /checkout { try_files /checkout.html =404; }
  location = /es/checkout { try_files /checkout.html =404; }
  location = /obrigado { try_files /obrigado.html =404; }
  location = /es/obrigado { try_files /obrigado.html =404; }
  location = /admin { if ($sales_host_enabled = 1) { return 404; } try_files /admin.html =404; }

  location = /termos { try_files /termos.html =404; }
  location = /es/termos { try_files /termos.html =404; }
  location = /privacidade { try_files /privacidade.html =404; }
  location = /es/privacidade { try_files /privacidade.html =404; }
  location = /suporte { try_files /suporte.html =404; }
  location = /es/suporte { try_files /suporte.html =404; }

  location = /reset { if ($sales_host_enabled = 1) { return 404; } try_files /reset.html =404; }
  location = /es/reset { if ($sales_host_enabled = 1) { return 404; } try_files /reset.html =404; }
  location = /reset.html { if ($sales_host_enabled = 1) { return 404; } try_files /reset.html =404; }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(?:html|js)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|svg|webmanifest)$ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
    try_files $uri =404;
  }

  location = /robots.txt { try_files $robots_file =404; }
  location = /sitemap.xml { if ($sales_host_enabled = 0) { return 404; } add_header Content-Type application/xml; try_files /sitemap.xml =404; }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri/ $root_entry;
  }
}
