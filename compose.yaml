# ATENÇÃO — DOIS MODOS DE DEPLOY
#
# Desenvolvimento (local):  docker compose up
#   Usa este arquivo: api, worker e portal sobem como serviços separados.
#   O serviço `worker` aqui só existe para dev/compose; ele IGNORA o Dockerfile
#   raiz (build_pack: dockerfile do Coolify não lê compose.yaml).
#
# Produção (Coolify):  build_pack=dockerfile → usa o Dockerfile da raiz
#   O Dockerfile sobe uvicorn + worker + nginx num container único via start.sh.
#   O serviço `worker` abaixo NÃO é criado em produção — não edite o Dockerfile
#   para remover o worker do start.sh achando que o compose o cobre.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrodicas}
      POSTGRES_USER: ${POSTGRES_USER:-astrodicas}
      # ⚠️ DEVELOPMENT ONLY: 'trust' auth disables password validation entirely.
      # NEVER use in staging/production without secret-managed POSTGRES_PASSWORD.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrodicas}@db:5432/${POSTGRES_DB:-astrodicas}
      SITE_ORIGIN: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SITE_SECRET_KEY: ${SITE_SECRET_KEY:?set SITE_SECRET_KEY in the environment}
      CAKTO_WEBHOOK_SECRET: ${CAKTO_WEBHOOK_SECRET:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./api
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrodicas}@db:5432/${POSTGRES_DB:-astrodicas}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MAX_CONCURRENCY: ${MINIMAX_MAX_CONCURRENCY:-8}
      JOB_VISIBILITY_TIMEOUT_MINUTES: ${JOB_VISIBILITY_TIMEOUT_MINUTES:-10}
      SITE_SECRET_KEY: ${SITE_SECRET_KEY:?set SITE_SECRET_KEY in the environment}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 5m

  portal:
    build:
      context: .
      dockerfile: portal-demo/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
