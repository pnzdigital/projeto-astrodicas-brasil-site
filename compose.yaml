services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrodicas}
      POSTGRES_USER: ${POSTGRES_USER:-astrodicas}
      # Local-only compose uses trust auth; production must provide a secret-managed password.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrodicas}@db:5432/${POSTGRES_DB:-astrodicas}
      SITE_ORIGIN: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SITE_SECRET_KEY: ${SITE_SECRET_KEY:?set SITE_SECRET_KEY in the environment}
      CAKTO_WEBHOOK_SECRET: ${CAKTO_WEBHOOK_SECRET:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  portal:
    build:
      context: .
      dockerfile: portal-demo/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
